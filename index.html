<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZEFRAM PLAYER NEO</title>
    <meta name="apple-mobile-web-app-title" content="ZPN">
    <link rel="manifest" href="manifest.json">
    <link rel="ZPN-icon" href="icon.png">
    <meta name="ZPN-web-app-capable" content="yes">
    <meta name="ZPN-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Michroma:wght@400;700&display=swap" rel="stylesheet">
    <script src="lib/jsmediatags.min.js"></script>
    <style>
        :root {
             --neon-blue: #80f9ff;
            --neon-blue-glow: rgba(0, 242, 255, 0.7);
            --bg-black: #080808;
            --font-header: 'Michroma', sans-serif;
            --font-main: "A-OTF Gothic MB101 Pr5 R", sans-serif;
            --track-bg: rgba(255, 255, 255, 0.03);
            --track-active-bg: rgba(128, 249, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-black);
            color: #fff;
            font-family: var(--font-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header Area */
        header {
            padding: env(safe-area-inset-top) 20px 10px;
            background: linear-gradient(to bottom, #111, var(--bg-black));
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: var(--font-header);
            font-size: 14px;
            letter-spacing: 0.15em;
            margin: 0;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue-glow);
        }

        .folder-btn {
            background: none;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-family: var(--font-header);
            cursor: pointer;
            transition: 0.2s;
        }

        .folder-btn:active {
            background: var(--neon-blue);
            color: #000;
        }

        #current-folder-path {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* List Area */
        #list-container {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 0;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            margin: 2px 10px;
            background: var(--track-bg);
            border-radius: 8px;
            transition: background 0.2s;
        }

        .track-item.active {
            background: var(--track-active-bg);
            border-left: 3px solid var(--neon-blue);
        }

        .track-info {
            flex-grow: 1;
            margin-right: 15px;
            overflow: hidden;
        }

        .track-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-meta {
            font-size: 10px;
            color: #666;
            display: flex;
            gap: 10px;
        }

        .duration-badge {
            font-family: var(--font-header);
            color: #888;
            font-size: 10px;
        }

        /* Player Area */
        .player-bar {
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px calc(env(safe-area-inset-bottom) + 10px);
            flex-shrink: 0;
        }

        .now-playing-title {
            font-size: 13px;
            text-align: center;
            margin-bottom: 10px;
            color: var(--neon-blue);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 1.2em;
        }

        .progress-container {
            width: 100%;
            height: 30px;
            display: flex;
            align-items: center;
            position: relative;
        }

        #progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            appearance: none;
            outline: none;
        }

        #progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue-glow);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-header);
            font-size: 9px;
            color: #666;
            margin-top: -5px;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .btn-play {
            width: 54px;
            height: 54px;
            background: var(--neon-blue);
            border-radius: 50%;
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue-glow);
        }

        .btn-play svg {
            width: 28px;
            height: 28px;
        }

        .sub-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 5px;
        }

        .sub-btn {
            background: #222;
            border: none;
            color: #888;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-family: var(--font-header);
            min-width: 60px;
        }

        .sub-btn.active {
            background: var(--neon-blue);
            color: #000;
        }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .speed-btn {
            background: none;
            border: 1px solid #444;
            color: #888;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-family: var(--font-header);
        }

        #speed-val {
            font-family: var(--font-header);
            font-size: 12px;
            color: var(--neon-blue);
            width: 40px;
            text-align: center;
        }

        .lite-toggle {
            position: absolute;
            top: env(safe-area-inset-top);
            right: 10px;
            padding: 10px;
            opacity: 0.3;
        }

        /* Lite Mode */
        body.is-lite #list-container {
            display: none;
        }
        body.is-lite .player-bar {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-bottom: env(safe-area-inset-bottom);
        }
        body.is-lite .now-playing-title {
            font-size: 20px;
            margin-bottom: 40px;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>ZEFRAM PLAYER NEO</h1>
            <button class="folder-btn" id="btn-folder">選 曲</button>
        </div>
        <div id="current-folder-path">FOLDER: NOT SELECTED</div>
    </header>

    <div id="list-container">
        </div>

    <div class="player-bar">
        <div class="now-playing-title" id="track-title">NO TRACK SELECTED</div>
        
        <div class="progress-container">
            <input type="range" id="progress-bar" value="0" min="0" step="0.1">
        </div>
        <div class="time-display">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="btn-shuffle">
                <svg viewBox="0 0 24 24"><path d="M10.59,9.17L5.41,4L4,5.41l5.17,5.17L10.59,9.17z M14.5,4l2.04,2.04L4,18.59L5.41,20L17.96,7.46L20,9.5V4H14.5z M14.83,13.41 l-1.41,1.41l3.13,3.13L14.5,20H20v-5.5l-2.04,2.04L14.83,13.41z"/></svg>
            </button>
            <button class="ctrl-btn" id="btn-prev">
                <svg viewBox="0 0 24 24"><path d="M6,6h2v12H6V6z M9.5,12l8.5,6V6L9.5,12z"/></svg>
            </button>
            <button class="ctrl-btn btn-play" id="btn-play">
                <svg viewBox="0 0 24 24" id="play-icon"><path d="M8,5v14l11-7L8,5z"/></svg>
            </button>
            <button class="ctrl-btn" id="btn-next">
                <svg viewBox="0 0 24 24"><path d="M6,18l8.5-6L6,6V18z M16,6v12h2V6H16z"/></svg>
            </button>
            <button class="ctrl-btn" id="btn-repeat">
                <svg viewBox="0 0 24 24"><path d="M7,7h10v3l4-4l-4-4v3H5v6h2V7z M17,17H7v-3l-4,4l4,4v-3h12v-6h-2V17z"/></svg>
            </button>
        </div>

        <div class="speed-control">
            <button class="speed-btn" id="speed-down">－</button>
            <div id="speed-val">1.00</div>
            <button class="speed-btn" id="speed-up">＋</button>
            <button class="speed-btn" id="speed-reset">RESET</button>
        </div>
    </div>

    <script>
    const ICON_PLAY = '<path d="M8,5v14l11-7L8,5z"/>';
    const ICON_PAUSE = '<path d="M6,19h4V5H6V19z M14,5v14h4V5H14z"/>';

    let db;
    let currentHandle = null;
    let currentPlayingFileName = null;
    let isShuffle = false;
    let isRepeat = false;
    let playbackSpeed = 1.0;
    let shuffleQueue = [];
    let shuffleIndex = -1;

    const audio = new Audio();
    const btnFolder = document.getElementById('btn-folder');
    const listContainer = document.getElementById('list-container');
    const trackTitle = document.getElementById('track-title');
    const btnPlay = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const progressBar = document.getElementById('progress-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnRepeat = document.getElementById('btn-repeat');
    const speedVal = document.getElementById('speed-val');
    const btnSpeedUp = document.getElementById('speed-up');
    const btnSpeedDown = document.getElementById('speed-down');
    const btnSpeedReset = document.getElementById('speed-reset');
    const folderPathDisplay = document.getElementById('current-folder-path');

    const request = indexedDB.open("ZeframPlayerDB", 1);
    request.onupgradeneeded = e => {
        db = e.target.result;
        db.createObjectStore("settings");
    };
    request.onsuccess = e => {
        db = e.target.result;
        loadLastFolder();
    };

    async function loadLastFolder() {
        const tx = db.transaction("settings", "readonly");
        const handle = await tx.objectStore("settings").get("lastFolder");
        if (handle) {
            const permission = await handle.queryPermission();
            if (permission === 'granted') {
                currentHandle = handle;
                folderPathDisplay.innerText = `FOLDER: ${handle.name}`;
                renderList();
            }
        }
    }

    btnFolder.onclick = async () => {
        try {
            currentHandle = await window.showDirectoryPicker();
            const tx = db.transaction("settings", "readwrite");
            tx.objectStore("settings").put(currentHandle, "lastFolder");
            folderPathDisplay.innerText = `FOLDER: ${currentHandle.name}`;
            renderList();
        } catch (e) { console.error(e); }
    };

    async function getFolderFiles() {
        const files = [];
        if (!currentHandle) return files;
        for await (const entry of currentHandle.values()) {
            if (entry.kind === 'file' && /\.(mp3|wav|m4a|aac)$/i.test(entry.name)) {
                files.push({ name: entry.name, handle: entry });
            }
        }
        return files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
    }

    async function renderList() {
        const rawFiles = await getFolderFiles();
        const files = [];
        for (let f of rawFiles) {
            files.push({ file: await f.handle.getFile() });
        }
        
        listContainer.innerHTML = '';
        files.forEach((f, idx) => {
            const id = `track-${idx}`;
            const item = document.createElement('div');
            item.className = 'track-item';
            if (f.file.name === currentPlayingFileName) item.classList.add('active');
            
            item.innerHTML = `
                <div class="track-info">
                    <div class="track-name">${f.file.name}</div>
                    <div class="track-meta">
                        <span id="dur-${id}" class="duration-badge">--:--</span>
                    </div>
                </div>
            `;
            item.onclick = () => loadTrack(f.file, true);
            listContainer.appendChild(item);

            // 再生時間の取得ロジック（キャッシュ機能付き）
            if (f.file) {
                const cacheKey = `dur_${f.file.name}_${f.file.size}`;
                const cached = localStorage.getItem(cacheKey);

                if (cached) {
                    document.getElementById(`dur-${id}`).innerText = cached;
                } else {
                    window.jsmediatags.read(f.file, {
                        onSuccess: (tag) => {
                            const url = URL.createObjectURL(f.file);
                            const temp = new Audio(url);
                            temp.onloadedmetadata = () => {
                                const durStr = formatTime(temp.duration);
                                document.getElementById(`dur-${id}`).innerText = durStr;
                                localStorage.setItem(cacheKey, durStr);
                                URL.revokeObjectURL(url);
                            };
                        }
                    });
                }
            }
        });
    }

    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' + s : s}`;
    }

    async function loadTrack(file, autoPlay = false) {
        currentPlayingFileName = file.name;
        const url = URL.createObjectURL(file);
        audio.src = url;
        audio.playbackRate = playbackSpeed;
        trackTitle.innerText = file.name;
        
        document.querySelectorAll('.track-item').forEach(el => {
            el.classList.toggle('active', el.querySelector('.track-name').innerText === file.name);
        });

        audio.onloadedmetadata = () => {
            progressBar.max = audio.duration;
            timeTotal.innerText = formatTime(audio.duration);
        };

        if (autoPlay) {
            audio.play();
            playIcon.innerHTML = ICON_PAUSE;
        }
    }

    btnPlay.onclick = () => {
        if (!audio.src) return;
        if (audio.paused) {
            audio.play();
            playIcon.innerHTML = ICON_PAUSE;
        } else {
            audio.pause();
            playIcon.innerHTML = ICON_PLAY;
        }
    };

    audio.ontimeupdate = () => {
        progressBar.value = audio.currentTime;
        timeCurrent.innerText = formatTime(audio.currentTime);
    };

    progressBar.oninput = () => {
        audio.currentTime = progressBar.value;
    };

    btnSpeedUp.onclick = () => {
        playbackSpeed = Math.min(2.0, playbackSpeed + 0.01);
        updateSpeed();
    };
    btnSpeedDown.onclick = () => {
        playbackSpeed = Math.max(0.5, playbackSpeed - 0.01);
        updateSpeed();
    };
    btnSpeedReset.onclick = () => {
        playbackSpeed = 1.0;
        updateSpeed();
    };

    function updateSpeed() {
        audio.playbackRate = playbackSpeed;
        speedVal.innerText = playbackSpeed.toFixed(2);
    }

    btnShuffle.onclick = () => {
        isShuffle = !isShuffle;
        btnShuffle.classList.toggle('active', isShuffle);
        if (isShuffle) refreshShuffleQueue();
    };

    async function refreshShuffleQueue() {
        const files = await getFolderFiles();
        const fullFiles = [];
        for (let f of files) fullFiles.push({ file: await f.handle.getFile() });
        shuffleQueue = fullFiles.sort(() => Math.random() - 0.5);
        shuffleIndex = 0;
    }

    btnRepeat.onclick = () => {
        isRepeat = !isRepeat;
        btnRepeat.classList.toggle('active', isRepeat);
    };

    async function playNext() {
        const files = await getFolderFiles();
        const fullFiles = [];
        for (let f of files) fullFiles.push({ file: await f.handle.getFile() });
        
        if (fullFiles.length <= 1) {
            audio.currentTime = 0;
            audio.play();
            return;
        }

        if (isShuffle) {
            shuffleIndex++;
            if (shuffleIndex >= shuffleQueue.length) {
                if (isRepeat) await refreshShuffleQueue();
                else {
                    audio.pause();
                    playIcon.innerHTML = ICON_PLAY;
                    return;
                }
            }
            loadTrack(shuffleQueue[shuffleIndex].file, true);
        } else {
            const idx = fullFiles.findIndex(f => f.file.name === currentPlayingFileName);
            if (idx === fullFiles.length - 1 && !isRepeat) {
                audio.pause();
                playIcon.innerHTML = ICON_PLAY;
                return;
            }
            const nextIdx = (idx + 1) % fullFiles.length;
            loadTrack(fullFiles[nextIdx].file, true);
        }
    }

    async function playPrev() {
        const files = await getFolderFiles();
        const fullFiles = [];
        for (let f of files) fullFiles.push({ file: await f.handle.getFile() });

        if (fullFiles.length <= 1) {
            audio.currentTime = 0;
            audio.play();
            return;
        }

        if (isShuffle) {
            shuffleIndex--;
            if (shuffleIndex < 0) shuffleIndex = shuffleQueue.length - 1;
            loadTrack(shuffleQueue[shuffleIndex].file, true);
        } else {
            const idx = fullFiles.findIndex(f => f.file.name === currentPlayingFileName);
            const prevIdx = (idx - 1 + fullFiles.length) % fullFiles.length;
            loadTrack(fullFiles[prevIdx].file, true);
        }
    }

    btnNext.onclick = playNext;
    btnPrev.onclick = playPrev;

    audio.addEventListener('ended', playNext);

    // double tap prevention
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    </script>
</body>
</html>
