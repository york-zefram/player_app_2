<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZEFRAM PLAYER NEO</title>
    <meta name="apple-mobile-web-app-title" content="ZPN">
    <link rel="manifest" href="manifest.json">
    <link rel="ZPN-icon" href="icon.png">
    <meta name="ZPN-web-app-capable" content="yes">
    <meta name="ZPN-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <script src="./jsmediatags.min.js"></script>
    <style>
        :root {
             --neon-blue: #80f9ff;
            --neon-blue-glow: rgba(0, 242, 255, 0.7);
            --bg-black: #080808;
            --font-header: 'Michroma', sans-serif;
            --font-main: "A-OTF Gothic MB101 Pr5 R", sans-serif;
            --marker-size: 32px;
            --thumb-size: 32px; 
            --white-glow: rgba(255, 255, 255, 0.3);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-black);
            color: white;
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
            user-select: none;
        }

        .header {
            padding: 60px 20px 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0; font-family: var(--font-header);
            font-size: 16px; letter-spacing: 0.2em;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue-glow);
        }

        .main-display {
            flex: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 0 30px;
        }

        .track-info { text-align: center; width: 100%; margin-bottom: 40px; }
        #track-name {
            font-family: var(--font-header);
            font-size: 18px; margin-bottom: 8px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #artist-name { font-size: 13px; color: #888; letter-spacing: 0.1em; }

        .visualizer-area {
            width: 200px; height: 200px;
            border: 1px solid rgba(128, 249, 255, 0.2);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            position: relative; margin-bottom: 40px;
        }
        #album-art {
            width: 160px; height: 160px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue-glow);
        }

        .seek-container { width: 100%; position: relative; padding: 20px 0; }
        .seek-bar-bg {
            width: 100%; height: 2px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
        }
        #seek-bar-fill {
            position: absolute; top: 0; left: 0;
            height: 100%; width: 0%;
            background: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue-glow);
        }
        .ab-marker {
            position: absolute; top: -15px;
            width: var(--marker-size); height: var(--marker-size);
            display: none; justify-content: center; align-items: center;
            z-index: 10; transform: translateX(-50%);
        }
        .ab-marker span {
            font-family: var(--font-header); font-size: 10px; font-weight: bold;
            color: var(--bg-black); background: var(--neon-blue);
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px var(--neon-blue-glow);
        }

        .controls-main {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px;
        }
        .btn-circle {
            width: 54px; height: 54px; border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-play {
            width: 76px; height: 76px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue-glow);
        }
        .btn-circle:active { transform: scale(0.9); border-color: var(--neon-blue); }

        .sub-controls {
            width: 100%; display: flex; justify-content: space-around;
            padding-bottom: 40px;
        }
        .btn-rect {
            padding: 10px 15px; border: 1px solid rgba(255,255,255,0.2);
            font-family: var(--font-header); font-size: 10px;
            letter-spacing: 0.1em; color: #aaa; min-width: 80px; text-align: center;
        }
        .btn-rect.active {
            color: var(--bg-black); background: var(--neon-blue);
            border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue-glow);
        }

        #file-input { display: none; }
        .folder-btn {
            position: absolute; top: 60px; right: 20px;
            font-family: var(--font-header); font-size: 10px; color: var(--neon-blue);
            border: 1px solid var(--neon-blue); padding: 5px 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ZEFRAM PLAYER NEO</h1>
        <div class="folder-btn" onclick="document.getElementById('file-input').click()">選 曲</div>
    </div>

    <input type="file" id="file-input" webkitdirectory directory multiple>

    <div class="main-display">
        <div class="track-info">
            <div id="track-name">NO TRACK LOADED</div>
            <div id="artist-name">---</div>
        </div>

        <div class="visualizer-area">
            <img id="album-art" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
        </div>

        <div class="seek-container" id="seek-area">
            <div class="seek-bar-bg">
                <div id="seek-bar-fill"></div>
            </div>
            <div id="marker-a" class="ab-marker"><span>A</span></div>
            <div id="marker-b" class="ab-marker"><span>B</span></div>
        </div>

        <div class="controls-main">
            <div class="btn-circle" id="btn-prev">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </div>
            <div class="btn-circle btn-play" id="btn-play">
                <div id="play-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
            <div class="btn-circle" id="btn-next">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
            </div>
        </div>

        <div class="sub-controls">
            <div id="btn-shuffle" class="btn-rect">SHUFFLE</div>
            <div id="btn-ab" class="btn-rect">A-B REPEAT</div>
            <div id="btn-repeat" class="btn-rect">REPEAT</div>
        </div>
    </div>

    <script>
    const audio = new Audio();
    const btnPlay = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnRepeat = document.getElementById('btn-repeat');
    const btnAB = document.getElementById('btn-ab');
    const fileInput = document.getElementById('file-input');
    const trackNameDisp = document.getElementById('track-name');
    const artistNameDisp = document.getElementById('artist-name');
    const albumArt = document.getElementById('album-art');
    const progressBar = document.getElementById('seek-bar-fill');
    const seekArea = document.getElementById('seek-area');
    const markerA = document.getElementById('marker-a');
    const markerB = document.getElementById('marker-b');

    let files = [];
    let shuffleQueue = [];
    let shuffleIndex = 0;
    let isShuffle = false;
    let isRepeat = false;
    let isABRepeat = false;
    let startTimeAB = 0;
    let endTimeAB = 0;
    let abState = 0; // 0:None, 1:A-Set, 2:B-Set
    let currentPlayingFileName = "";

    const ICON_PLAY = '<svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    fileInput.onchange = (e) => {
        const rawFiles = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
        if (rawFiles.length === 0) return;
        
        // フォルダ階層を保持したリスト作成
        files = rawFiles.map(f => ({
            file: f,
            path: f.webkitRelativePath || f.name
        })).sort((a, b) => a.path.localeCompare(b.path));

        if (files.length > 0) {
            loadTrack(files[0].file, false);
            if (isShuffle) generateShuffleQueue();
        }
    };

    function loadTrack(file, autoPlay) {
        const url = URL.createObjectURL(file);
        audio.src = url;
        currentPlayingFileName = file.name;
        trackNameDisp.innerText = file.name.replace(/\.[^/.]+$/, "");
        artistNameDisp.innerText = "LOADING TAGS...";
        albumArt.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

        // タグ解析
        jsmediatags.read(file, {
            onSuccess: function(tag) {
                const tags = tag.tags;
                if (tags.artist) artistNameDisp.innerText = tags.artist;
                else artistNameDisp.innerText = "UNKNOWN ARTIST";

                if (tags.picture) {
                    const { data, format } = tags.picture;
                    let base64String = "";
                    for (let i = 0; i < data.length; i++) {
                        base64String += String.fromCharCode(data[i]);
                    }
                    albumArt.src = `data:${format};base64,${window.btoa(base64String)}`;
                }
            },
            onError: function(error) {
                artistNameDisp.innerText = "NO TAG DATA";
            }
        });

        resetAB();
        if (autoPlay) {
            audio.play();
            playIcon.innerHTML = ICON_PAUSE;
        }
    }

    btnPlay.onclick = () => {
        if (!audio.src) return;
        if (audio.paused) {
            audio.play();
            playIcon.innerHTML = ICON_PAUSE;
        } else {
            audio.pause();
            playIcon.innerHTML = ICON_PLAY;
        }
    };

    function updateProgress() {
        const currentTime = audio.currentTime;
        const duration = audio.duration;
        
        // ABリピート判定はontimeupdateへ移動
        
        requestAnimationFrame(updateProgress);
    }
    requestAnimationFrame(updateProgress);

    audio.ontimeupdate = () => {
        if (!isNaN(audio.duration)) {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = progress + '%';
        }
        // スリープ中も動作するイベント内でABリピートを判定
        if (isABRepeat && audio.currentTime >= endTimeAB) {
            audio.currentTime = startTimeAB;
        }
    };

    btnAB.onclick = () => {
        if (!audio.src) return;
        if (abState === 0) {
            startTimeAB = audio.currentTime;
            markerA.style.left = (startTimeAB / audio.duration * 100) + '%';
            markerA.style.display = 'flex';
            abState = 1;
            btnAB.innerText = "SET B";
            btnAB.classList.add('active');
        } else if (abState === 1) {
            endTimeAB = audio.currentTime;
            if (endTimeAB <= startTimeAB) return;
            markerB.style.left = (endTimeAB / audio.duration * 100) + '%';
            markerB.style.display = 'flex';
            isABRepeat = true;
            abState = 2;
            btnAB.innerText = "A-B ON";
        } else {
            resetAB();
        }
    };

    function resetAB() {
        isABRepeat = false;
        abState = 0;
        markerA.style.display = 'none';
        markerB.style.display = 'none';
        btnAB.innerText = "A-B REPEAT";
        btnAB.classList.remove('active');
    }

    btnShuffle.onclick = () => {
        isShuffle = !isShuffle;
        btnShuffle.classList.toggle('active', isShuffle);
        if (isShuffle) generateShuffleQueue();
    };

    btnRepeat.onclick = () => {
        isRepeat = !isRepeat;
        btnRepeat.classList.toggle('active', isRepeat);
    };

    function generateShuffleQueue() {
        shuffleQueue = [...files].sort(() => Math.random() - 0.5);
        shuffleIndex = 0;
    }

    function getFolderFiles() {
        return files;
    }

    function playNext() {
        const files = getFolderFiles();
        if (files.length <= 1) { audio.currentTime = 0; audio.play(); return; }

        if (isShuffle) {
            shuffleIndex++;
            if (shuffleIndex >= shuffleQueue.length) {
                if (!isRepeat) { audio.pause(); playIcon.innerHTML = ICON_PLAY; return; }
                shuffleIndex = 0;
            }
            loadTrack(shuffleQueue[shuffleIndex].file, true);
        } else {
            const idx = files.findIndex(f => f.file.name === currentPlayingFileName);
            if (idx === files.length - 1 && !isRepeat) {
                audio.pause(); playIcon.innerHTML = ICON_PLAY; return;
            }
            const nextIdx = (idx + 1) % files.length;
            loadTrack(files[nextIdx].file, true);
        }
    }

    function playPrev() {
        const files = getFolderFiles();
        if (files.length <= 1) { audio.currentTime = 0; audio.play(); return; }

        if (isShuffle) {
            shuffleIndex--;
            if (shuffleIndex < 0) shuffleIndex = shuffleQueue.length - 1;
            loadTrack(shuffleQueue[shuffleIndex].file, true);
        } else {
            const idx = files.findIndex(f => f.file.name === currentPlayingFileName);
            const prevIdx = (idx - 1 + files.length) % files.length;
            loadTrack(files[prevIdx].file, true);
        }
    }

    btnNext.onclick = playNext;
    btnPrev.onclick = playPrev;
    
    audio.addEventListener('ended', () => { 
        playNext(); 
    });

    seekArea.onclick = (e) => {
        if (!audio.src || isNaN(audio.duration)) return;
        const rect = seekArea.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
    };
    </script>
</body>
</html>
