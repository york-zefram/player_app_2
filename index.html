<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZEFRAM PLAYER NEO</title>
    <meta name="apple-mobile-web-app-title" content="ZPN">
    <link rel="manifest" href="manifest.json">
    <link rel="ZPN-icon" href="icon.png">
    <meta name="ZPN-web-app-capable" content="yes">
    <meta name="ZPN-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Michroma:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
             --neon-blue: #80f9ff;
            --neon-blue-glow: rgba(0, 242, 255, 0.7);
            --bg-black: #080808;
            --font-header: 'Michroma', sans-serif;
            --font-main: "A-OTF Gothic MB101 Pr5 R", sans-serif;
            --marker-size: 32px;
            --thumb-size: 32px; 
            --white-glow: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--bg-black);
            color: #fff;
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .lite-only { display: none !important; }
        body.is-lite .neo-only { display: none !important; }
        body.is-lite .lite-only {
            display: flex !important;
            width: 76px; height: 76px; border-radius: 50%;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue-glow), inset 0 0 10px var(--neon-blue-glow);
            justify-content: center; align-items: center;
        }
        body.is-lite .container-3 { justify-content: center; gap: 40px; }

        #thumbnail-container { display: none; justify-content: center; align-items: center; margin: 10px 0; flex-shrink: 0; }
        body.is-lite #thumbnail-container { display: flex; }

        #album-art-wrapper {
            position: relative; width: 180px; height: 180px; border-radius: 12px;
            border: 1px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue-glow);
            background-color: #222; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        #album-art { width: 100%; height: 100%; object-fit: cover; display: none; }
        #default-art-icon {
            width: 80px; height: 80px; fill: var(--neon-blue);
            filter: drop-shadow(0 0 8px var(--neon-blue-glow)); opacity: 0.6;
        }

        #app-container {
            display: flex; width: 200vw; height: 100%;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform; backface-visibility: hidden;
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 8, 0.95); backdrop-filter: blur(8px);
            z-index: 10000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 20px;
        }
        #tap-to-start {
            color: var(--neon-blue); font-weight: bold; font-family: var(--font-header);
            border: 2px solid var(--neon-blue); padding: 15px 30px; border-radius: 30px;
            box-shadow: 0 0 20px var(--neon-blue-glow); text-align: center; cursor: pointer;
        }

        .player-wrapper { flex: 0 0 100vw; width: 100vw; padding: 25px 10px 10px 10px; box-sizing: border-box; display: flex; flex-direction: column; height: 100%; }
        header.glass-header { position: relative; text-align: center; padding: 0 0 2px 0; flex-shrink: 0; height: 40px; display: flex; align-items: center; justify-content: center; }
        .app-title { margin: 0; color: var(--neon-blue); font-family: var(--font-header); font-size: 0.9rem; line-height: 1; letter-spacing: 1px; text-shadow: 0 0 10px var(--neon-blue-glow); white-space: nowrap; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .header-dot-btn { width: 12px; height: 12px; background-color: #fff; border-radius: 50%; border: none; box-shadow: 0 0 8px #fff, 0 0 15px var(--white-glow); cursor: pointer; padding: 0; flex-shrink: 0; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; }

        .info-header { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 5px 0; flex-shrink: 0; }
        .text-fields { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; overflow: hidden; }
        .marquee-box { width: 100%; overflow: hidden; white-space: nowrap; text-align: center; min-height: 1.4em; }
        .marquee-inner { display: inline-block; white-space: nowrap; will-change: transform; }
        .scrolling-content { display: inline-block; padding-right: 50px; animation: scroll-slow 15s linear infinite; }
        @keyframes scroll-slow { 0% { transform: translateX(0); } 10% { transform: translateX(0); } 85% { transform: translateX(-50%); } 100% { transform: translateX(-50%); } }
        
        #title-text { font-weight: bold; font-size: 1.2rem; color: #fff; }
        #artist-text { font-size: 0.9rem; color: var(--neon-blue); }
        
        .status-action-row { 
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 24px; margin-top: 5px; padding: 10px 0; 
            border-top: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 1px solid rgba(255, 255, 255, 0.1); box-sizing: border-box;
        }
        .btn-status-side { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--neon-blue); background: rgba(0, 242, 255, 0.1); color: var(--neon-blue); display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 10px var(--neon-blue-glow); }
        .time-group { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-header); min-width: 140px; }
        #time-display { color: #fff; font-size: 1.1rem; font-weight: bold; }
        #ab-range-text { color: var(--neon-blue); font-size: 0.85rem; font-weight: bold; }

        .main-controls-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-around; align-items: center; width: 100%; padding: 10px 0; }
        section.container-2 { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; padding: 15px 0; }
        .seek-wrapper { position: relative; width: 87%; height: 6px; display: flex; align-items: center; background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        .seek-bg-layer { position: absolute; top: 0; bottom: 0; background: var(--neon-blue); z-index: 1; border-radius: 3px; box-shadow: 0 0 15px var(--neon-blue-glow); }
        input[type="range"]#main-seek { -webkit-appearance: none; width: 100%; background: transparent; position: relative; z-index: 5; height: 60px; outline: none; margin: 0; padding: 0; }
        input[type="range"]#main-seek::-webkit-slider-thumb { -webkit-appearance: none; height: var(--thumb-size); width: var(--thumb-size); border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--neon-blue-glow); }
        .marker { position: absolute; width: var(--marker-size); height: var(--marker-size); border-radius: 50%; background: rgba(20, 20, 20, 0.95); color: var(--neon-blue); font-size: 14px; font-family: var(--font-header); font-weight: bold; display: flex; justify-content: center; align-items: center; z-index: 20; border: 2px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue-glow), inset 0 0 10px var(--neon-blue-glow); top: 50%; margin-left: calc(var(--marker-size) / -2); transform: translate3d(0, -50%, 0); transition: none; }

        .container-3 { width: 100%; display: flex; justify-content: center; align-items: center; gap: 20px; padding: 10px 0; }
        .main-btn { color: var(--neon-blue); background: transparent !important; transition: all 0.3s; border: 1px solid rgba(0, 242, 255, 0.3); }
        .btn-large { width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue-glow), inset 0 0 10px var(--neon-blue-glow); }
        .btn-small { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue-glow), inset 0 0 10px var(--neon-blue-glow); opacity: 0.9; }
        .btn-icon { font-size: 2.4rem; filter: drop-shadow(0 0 8px var(--neon-blue)); display: flex; align-items: center; justify-content: center; } 
        .btn-icon-s { font-size: 0.9rem; font-family: var(--font-header); font-weight: bold; }
        .svg-icon { width: 1em; height: 1em; fill: currentColor; }

        .container-tempo { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 5px 10px; box-sizing: border-box; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .tempo-labels { display: flex; justify-content: space-between; color: var(--neon-blue); font-family: var(--font-header); font-size: 0.7rem; opacity: 0.8; padding: 0 5%; }
        .tempo-slider-wrapper { position: relative; width: 88%; height: 36px; display: flex; align-items: center; margin: 0 auto; }
        .tempo-bg-layer { position: absolute; width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; z-index: 1; top: 50%; transform: translateY(-50%); }
        input[type="range"]#tempo-slider { -webkit-appearance: none; width: 100%; background: transparent; position: relative; z-index: 5; height: 40px; outline: none; }
        input[type="range"]#tempo-slider::-webkit-slider-thumb { -webkit-appearance: none; height: var(--thumb-size); width: var(--thumb-size); border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff, 0 0 30px var(--neon-blue-glow); }
        .tempo-controls { display: flex; justify-content: space-between; align-items: center; width: 90%; margin: 0 auto; gap: 12px; }
        .btn-tempo { width: 44px; height: 44px; border-radius: 50%; font-family: var(--font-header); font-size: 1rem; background: transparent !important; border: 2px solid var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue-glow); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        #playlist-overlay { flex: 0 0 100vw; width: 100vw; height: 100%; background: var(--bg-black); display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom); border-left: 1px solid rgba(0, 242, 255, 0.2); overflow: hidden; }
        #track-list-container { flex: 1; position: relative; overflow: hidden; width: 100%; }
        #track-list { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; list-style: none; padding: 0; margin: 0; border-top: 1px solid #222; -webkit-overflow-scrolling: touch; will-change: transform; transition: transform 0.2s ease-out; }
        #track-list::-webkit-scrollbar { display: none; }
        .playlist-header { display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--neon-blue); padding-bottom: 6px; }
        .playlist-header span { color:var(--neon-blue); font-family:var(--font-header); font-size:0.6rem; }
        #btn-close-list { background:none; border:none; color:var(--neon-blue); font-size: 0.6rem; font-family: var(--font-header); cursor: pointer; }
        .breadcrumb { font-size: 0.6rem; color: var(--neon-blue); margin: 6px 0; border-bottom: 1px solid #333; padding-bottom: 4px; font-family: var(--font-header); text-transform: uppercase; }
        .item { border-bottom: 1px solid #222; display: flex; text-align: left; box-sizing: border-box; }
        .item.folder { color: var(--neon-blue); font-weight: bold; font-size: 0.9rem; align-items: center; height: 44px; padding: 0 8px; }
        .item.track { padding: 0 8px; flex-direction: column; justify-content: center; height: 44px; }
        .item-upper { display: flex; align-items: center; justify-content: space-between; width: 100%; overflow: hidden; }
        .item-lower { display: block; color: #888; font-size: 0.65rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-name-part { flex: 1; font-size: 0.85rem; color: #fff; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
        .track-duration-part { flex-shrink: 0; color: #888; font-size: 0.65rem; font-family: var(--font-header); text-align: right; min-width: 44px; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div id="tap-to-start">START PLAYER</div>
</div>

<div id="app-container">
    <div class="player-wrapper">
        <header class="glass-header">
            <h1 class="app-title" id="main-app-title">ZEFRAM PLAYER NEO</h1>
            <button class="header-dot-btn" id="btn-header-action"></button>
        </header>

        <div id="thumbnail-container">
            <div id="album-art-wrapper">
                <svg id="default-art-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <img id="album-art" src="" alt="">
            </div>
        </div>

        <section class="info-header">
            <div class="text-fields">
                <div class="marquee-box" id="title-box"><div id="title-inner" class="marquee-inner"><span id="title-text">SELECT TRACK</span></div></div>
                <div class="marquee-box" id="artist-box"><div id="artist-inner" class="marquee-inner"><span id="artist-text">UNKNOWN ARTIST</span></div></div>
            </div>
            
            <div class="status-action-row">
                <button class="btn-status-side" id="btn-folder-scan" style="position:relative;">
                    <svg class="svg-icon" style="font-size:1.4rem;" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    <input type="file" id="folder-input" webkitdirectory directory multiple style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; display:none;">
                </button>
                <div class="time-group">
                    <div id="time-display">00:00 / 00:00</div>
                    <div id="ab-range-text" class="neo-only">00:00 ▶ 00:00</div>
                </div>
                <button class="btn-status-side" id="btn-open-playlist">
                    <svg class="svg-icon" style="font-size:1.4rem;" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </button>
            </div>
        </section>

        <div class="main-controls-container">
            <section class="container-2">
                <div class="seek-wrapper" id="seek-wrapper">
                    <div class="seek-bg-layer" id="seek-bg"></div>
                    <input type="range" id="main-seek" min="0" max="100" value="0" step="0.1">
                    <div class="marker neo-only" id="marker-a">A</div>
                    <div class="marker neo-only" id="marker-b">B</div>
                </div>
            </section>

            <section class="container-3">
                <button class="main-btn lite-only" id="btn-prev-track"><span class="btn-icon"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></span></button>
                <button class="main-btn btn-small neo-only" id="btn-set-a"><span class="btn-icon-s">A</span></button>
                <button class="main-btn btn-large neo-only" id="btn-back-to-a"><span class="btn-icon"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></span></button>
                <button class="main-btn btn-play btn-large" id="btn-play"><span class="btn-icon" id="play-icon"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></button>
                <button class="main-btn btn-small neo-only" id="btn-set-b"><span class="btn-icon-s">B</span></button>
                <button class="main-btn lite-only" id="btn-next-track"><span class="btn-icon"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></span></button>
            </section>
        </div>

        <section class="container-tempo neo-only">
            <div class="tempo-labels"><span>-50%</span> <span>0%</span> <span>+50%</span></div>
            <div class="tempo-slider-wrapper">
                <div class="tempo-bg-layer"></div>
                <input type="range" id="tempo-slider" min="50" max="150" step="1" value="100">
            </div>
            <div class="tempo-controls">
                <button class="main-btn btn-tempo" id="tempo-minus">－</button>
                <button class="main-btn btn-tempo" id="tempo-reset">〇</button>
                <button class="main-btn btn-tempo" id="tempo-plus">＋</button>
            </div>
        </section>
    </div>

    <div id="playlist-overlay">
        <div class="playlist-header"><span>MUSIC PLAYLIST</span><button id="btn-close-list">CLOSE</button></div>
        <div id="breadcrumb" class="breadcrumb">ROOT /</div>
        <div id="track-list-container"><ul id="track-list"></ul></div>
    </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
    const audio = document.getElementById('audio');
    const seek = document.getElementById('main-seek');
    const seekBg = document.getElementById('seek-bg');
    const markerA = document.getElementById('marker-a');
    const markerB = document.getElementById('marker-b');
    const tempoSlider = document.getElementById('tempo-slider');
    const playIcon = document.getElementById('play-icon');
    const loadingOverlay = document.getElementById('loading-overlay');
    const tapToStart = document.getElementById('tap-to-start');
    const timeDisplay = document.getElementById('time-display');
    const abRangeText = document.getElementById('ab-range-text');
    const seekWrapper = document.getElementById('seek-wrapper');
    const appContainer = document.getElementById('app-container');
    const trackList = document.getElementById('track-list');
    const appTitle = document.getElementById('main-app-title');
    const btnHeaderAction = document.getElementById('btn-header-action');
    const albumArt = document.getElementById('album-art');
    const defaultArtIcon = document.getElementById('default-art-icon');

    const ICON_PLAY = '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M6.5 19h4V5h-4v14zm9 0h4V5h-4v14z"/></svg>';
    
    let posA = 0, posB = 100, isDragging = false;
    let currentObjectUrl = null, currentPage = 0, currentArtUrl = null;
    let currentPlayingFileName = ""; 

    btnHeaderAction.onclick = () => {
        const isLite = document.body.classList.toggle('is-lite');
        appTitle.innerText = isLite ? "ZEFRAM PLAYER LITE" : "ZEFRAM PLAYER NEO";
        updateSeekStyle();
    };

    function navigateTo(page) {
        currentPage = page;
        appContainer.style.transform = `translateX(${currentPage === 0 ? 0 : -50}%)`;
    }

    /* --- DB & Folder Logic --- */
    const DB_NAME = "ZeframPlayerDB_V2", STORE_NAME = "FilesStore", DB_VERSION = 20; 
    let allFiles = [], currentPath = [], directoryHandle = null;

    const openDB = () => new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradedeeded = (e) => { if (!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
        request.onsuccess = (e) => resolve(e.target.result); request.onerror = (e) => reject(e.target.error);
    });

    async function saveState() {
        const db = await openDB(), tx = db.transaction(STORE_NAME, "readwrite"), store = tx.objectStore(STORE_NAME);
        await store.put(directoryHandle, "folder_handle");
    }

    async function loadSavedList() {
        const db = await openDB(), tx = db.transaction(STORE_NAME, "readonly"), store = tx.objectStore(STORE_NAME);
        directoryHandle = await new Promise(r => { const req = store.get("folder_handle"); req.onsuccess = () => r(req.result); req.onerror = () => r(null); });
        if (directoryHandle) tapToStart.innerText = "RESTORE FOLDER ACCESS";
    }

    async function scanFolder(handle) {
        tapToStart.innerText = "SCANNING...";
        allFiles = [];
        async function scan(h, path = []) {
            for await (const entry of h.values()) {
                if (entry.kind === 'file' && entry.name.match(/\.(mp3|m4a|wav)$/i)) {
                    allFiles.push({ name: entry.name, path: [...path, entry.name], handle: entry, file: null });
                } else if (entry.kind === 'directory') await scan(entry, [...path, entry.name]);
            }
        }
        await scan(handle, [handle.name]);
        for (let f of allFiles) f.file = await f.handle.getFile();
        renderList();
        saveState();
        loadingOverlay.style.display = 'none';
    }

    tapToStart.onclick = async () => {
        if (tapToStart.innerText === "RESTORE FOLDER ACCESS") {
            try {
                if (await directoryHandle.requestPermission({ mode: 'read' }) === 'granted') await scanFolder(directoryHandle);
            } catch (e) { tapToStart.innerText = "START PLAYER"; }
        } else {
            try {
                directoryHandle = await window.showDirectoryPicker();
                await scanFolder(directoryHandle);
            } catch (e) { document.getElementById('folder-input').click(); loadingOverlay.style.display = 'none'; }
        }
    };

    /* --- Swipe Logic (右スワイプで戻る) --- */
    let touchStartX = 0;
    trackList.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive: true});
    trackList.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        if (touchEndX - touchStartX > 80 && currentPath.length > 0) goBackLevel();
    }, {passive: true});

    /* --- UI & Player Logic --- */
    function renderList() {
        trackList.innerHTML = '';
        document.getElementById('breadcrumb').innerText = "ROOT / " + currentPath.join(' / ').toUpperCase();
        if (currentPath.length > 0) {
            const up = document.createElement('li'); up.className = 'item folder'; up.innerText = `.. (BACK)`; up.onclick = goBackLevel; trackList.appendChild(up);
        }
        const dirs = new Set(), files = [];
        allFiles.forEach(f => {
            if (currentPath.every((p, i) => f.path[i] === p)) {
                const next = f.path[currentPath.length];
                if (f.path.length === currentPath.length + 1) files.push(f); else if (next) dirs.add(next);
            }
        });
        dirs.forEach(d => {
            const li = document.createElement('li'); li.className = 'item folder'; li.innerText = d.toUpperCase(); li.onclick = () => goForwardLevel(d); trackList.appendChild(li);
        });
        files.forEach(f => {
            const li = document.createElement('li'), id = `f-${f.name.replace(/[^\w]/g, '')}`;
            li.className = 'item track';
            li.innerHTML = `<div class="item-upper"><span class="track-name-part">${f.name.split('.').slice(0,-1).join('.')}</span><span class="track-duration-part" id="dur-${id}">--:--</span></div><div class="item-lower" id="meta-${id}">LOADING...</div>`;
            li.onclick = () => { loadTrack(f); navigateTo(0); };
            trackList.appendChild(li);
            if (f.file) {
                const url = URL.createObjectURL(f.file), t = new Audio(url);
                t.onloadedmetadata = () => { const d = document.getElementById(`dur-${id}`); if(d) d.innerText = formatTime(t.duration); URL.revokeObjectURL(url); };
                window.jsmediatags.read(f.file, { onSuccess: (tag) => { const m = document.getElementById(`meta-${id}`); if(m) m.innerText = (tag.tags.artist || "UNKNOWN").toUpperCase(); } });
            }
        });
    }

    function goForwardLevel(d) { currentPath.push(d); renderList(); }
    function goBackLevel() { currentPath.pop(); renderList(); }

    async function loadTrack(fileObj, isAuto = false) {
        audio.pause();
        const file = fileObj.handle ? await fileObj.handle.getFile() : fileObj.file;
        currentPlayingFileName = file.name;
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(file);
        audio.src = currentObjectUrl;
        audio.onloadeddata = () => {
            if (isAuto) { audio.play(); playIcon.innerHTML = ICON_PAUSE; }
            window.jsmediatags.read(file, {
                onSuccess: (tag) => {
                    document.getElementById('title-text').innerText = tag.tags.title || file.name.split('.').slice(0,-1).join('.');
                    document.getElementById('artist-text').innerText = (tag.tags.artist || "UNKNOWN ARTIST").toUpperCase();
                    if (currentArtUrl) URL.revokeObjectURL(currentArtUrl);
                    const pic = tag.tags.picture;
                    if (pic) {
                        const blob = new Blob([new Uint8Array(pic.data)], { type: pic.format });
                        currentArtUrl = URL.createObjectURL(blob); albumArt.src = currentArtUrl; albumArt.style.display = 'block'; defaultArtIcon.style.display = 'none';
                    } else { albumArt.style.display = 'none'; defaultArtIcon.style.display = 'block'; }
                    setTimeout(() => { checkMarquee('title-inner', 'title-box'); checkMarquee('artist-inner', 'artist-box'); }, 100);
                }
            });
            updateSeekStyle();
        };
    }

    function checkMarquee(innerId, boxId) {
        const inner = document.getElementById(innerId), box = document.getElementById(boxId);
        inner.classList.remove('scrolling-content'); 
        if (inner.scrollWidth > box.clientWidth) {
            if (!inner.querySelector('.marquee-clone')) {
                const span = inner.querySelector('span'), clone = span.cloneNode(true);
                clone.classList.add('marquee-clone'); inner.appendChild(clone);
            }
            inner.classList.add('scrolling-content');
        }
    }

    function updateSeekStyle() {
        const isLite = document.body.classList.contains('is-lite');
        const rectWidth = seekWrapper.clientWidth, thumbSize = 32;
        const getX = (p) => (p / 100) * (rectWidth - thumbSize) + (thumbSize / 2);
        if (isLite) {
            const p = (audio.currentTime / audio.duration) * 100 || 0;
            seekBg.style.transform = `translate3d(0, 0, 0)`; seekBg.style.width = `${(p/100) * rectWidth}px`;
        } else {
            const xA = getX(posA), xB = getX(posB);
            markerA.style.transform = `translate3d(${xA}px, -50%, 0)`; markerB.style.transform = `translate3d(${xB}px, -50%, 0)`;
            seekBg.style.transform = `translate3d(${xA}px, 0, 0)`; seekBg.style.width = `${xB - xA}px`;
            if (audio.duration) abRangeText.innerText = `${formatTime((posA/100)*audio.duration)} ▶ ${formatTime((posB/100)*audio.duration)}`;
        }
    }
    
    function formatTime(s) { if (isNaN(s)) return "00:00"; const m = Math.floor(s / 60), sec = Math.floor(s % 60); return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`; }

    function updateFrame() {
        if (audio.duration && !isDragging) {
            const cur = audio.currentTime, dur = audio.duration, curP = (cur / dur) * 100;
            seek.value = curP;
            timeDisplay.innerText = `${formatTime(cur)} / ${formatTime(dur)}`;
            updateSeekStyle();
            if (!document.body.classList.contains('is-lite') && (curP >= posB || curP < posA - 0.2)) audio.currentTime = (posA / 100) * dur;
        }
        requestAnimationFrame(updateFrame);
    }
    requestAnimationFrame(updateFrame);

    seek.oninput = (e) => { 
        isDragging = true;
        let val = parseFloat(e.target.value); 
        if (!document.body.classList.contains('is-lite')) val = Math.max(posA, Math.min(posB, val));
        e.target.value = val; audio.currentTime = (val / 100) * audio.duration;
    };
    seek.onchange = () => isDragging = false;

    document.getElementById('btn-play').onclick = () => {
        if (audio.paused) { audio.play(); playIcon.innerHTML = ICON_PAUSE; }
        else { audio.pause(); playIcon.innerHTML = ICON_PLAY; }
    };
    document.getElementById('btn-set-a').onclick = () => { posA = (audio.currentTime / audio.duration) * 100; updateSeekStyle(); };
    document.getElementById('btn-set-b').onclick = () => { posB = (audio.currentTime / audio.duration) * 100; updateSeekStyle(); };
    document.getElementById('btn-back-to-a').onclick = () => { audio.currentTime = (posA / 100) * audio.duration; audio.play(); playIcon.innerHTML = ICON_PAUSE; };

    function setupDraggable(el, isA) { 
        let dragging = false;
        const move = (e) => {
            if (!dragging) return;
            const rect = seekWrapper.getBoundingClientRect(), thumbSize = 32;
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            let val = ((x - thumbSize / 2) / (rect.width - thumbSize)) * 100;
            val = Math.max(0, Math.min(100, val));
            if (isA) posA = Math.min(val, posB - 1); else posB = Math.max(val, posA + 1);
            updateSeekStyle();
        };
        el.addEventListener('touchstart', (e) => { e.preventDefault(); dragging = true; }, {passive: false});
        el.addEventListener('mousedown', () => { dragging = true; });
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('mousemove', move);
        window.addEventListener('touchend', () => dragging = false);
        window.addEventListener('mouseup', () => dragging = false);
    }
    setupDraggable(markerA, true); setupDraggable(markerB, false);

    tempoSlider.oninput = (e) => audio.playbackRate = e.target.value / 100;
    document.getElementById('tempo-reset').onclick = () => { tempoSlider.value = 100; audio.playbackRate = 1.0; };
    document.getElementById('tempo-minus').onclick = () => { tempoSlider.value = parseInt(tempoSlider.value) - 1; audio.playbackRate = tempoSlider.value / 100; };
    document.getElementById('tempo-plus').onclick = () => { tempoSlider.value = parseInt(tempoSlider.value) + 1; audio.playbackRate = tempoSlider.value / 100; };

    document.getElementById('btn-open-playlist').onclick = () => navigateTo(1);
    document.getElementById('btn-close-list').onclick = () => navigateTo(0);

    function getFolderFiles() { return allFiles.filter(f => f.path.length === currentPath.length + 1 && currentPath.every((p, i) => f.path[i] === p)); }
    document.getElementById('btn-next-track').onclick = () => {
        const files = getFolderFiles(); if (files.length <= 1) return;
        const idx = files.findIndex(f => f.name === currentPlayingFileName);
        loadTrack(files[(idx + 1) % files.length], true); 
    };
    document.getElementById('btn-prev-track').onclick = () => {
        const files = getFolderFiles(); if (files.length <= 1) return;
        const idx = files.findIndex(f => f.name === currentPlayingFileName);
        loadTrack(files[(idx - 1 + files.length) % files.length], true); 
    };

    audio.addEventListener('ended', () => {
        if (document.body.classList.contains('is-lite')) {
            const files = getFolderFiles(); if (files.length > 1) {
                const idx = files.findIndex(f => f.name === currentPlayingFileName);
                loadTrack(files[(idx + 1) % files.length], true);
            }
        }
    });

    window.onload = loadSavedList;
</script>
</body>
</html>
